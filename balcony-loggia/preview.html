<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Лоджия — чертежи</title>
  <style>
    body { font-family: system-ui,sans-serif; margin: 16px; background: #111; color: #eee; }
    h1,h2 { font-size: 1.1rem; }
    h2 { color: #9cf; margin-top: 1.2rem; }
    img { width: 100%; background: #fff; border-radius: 8px; margin: 8px 0; }
    pre { background: #222; padding: 12px; border-radius: 8px; font-size: 14px; white-space: pre-wrap; }
    .ref { border: 3px solid #f80; }
  </style>
</head>
<body>
  <h1>Лоджия</h1>
  <h2>Ваше фото (трубы)</h2>
  <img class="ref" src="photo-ac-reference.jpg" alt="Фото труб у окна">
  <h2>Схема по этому фото</h2>
  <img src="elevation-ac-as-built.png" alt="Схема труб">
  <h2>Стена квартиры</h2>
  <img src="elevation-apartment-6800.png" alt="">
  <h2>Окна 6 м</h2>
  <img src="elevation-front-windows.png" alt="">
  <h2>План + трасса на лоджии</h2>
  <img src="plan-top.png" alt="">
  <h2>Сечение короба 0,07 x 0,06</h2>
  <img src="section-ac-trunk.png" alt="">
  <h2>Обрешётка — расчёт</h2>
  <pre id="obreshetka-md"></pre>
  <h2>План обрешётки (шаг 500)</h2>
  <img src="plan-obreshetka-top.png" alt="">
  <h2>Разрез: вынос 60 мм под трубы</h2>
  <img src="section-obreshetka-ac.png" alt="">
  <h2>Фасад: зоны обрешётки</h2>
  <img src="elevation-obreshetka-zones.png" alt="">
  <script>
    fetch('OBRESHEOTKA.md').then(r=>r.text()).then(t=>{
      document.getElementById('obreshetka-md').textContent=t;
    }).catch(()=>{});
  </script>
</body>
</html>
