<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="Arial,sans-serif">
  <style>
    text { font-size: 20px; fill: #111; }
    .pipe { fill: none; stroke: #111; stroke-width: 10; stroke-linecap: round; }
    .box { fill: rgba(120,180,120,0.35); stroke: #060; stroke-width: 3; }
  </style>
  <text x="600" y="35" text-anchor="middle" font-size="26" font-weight="bold">Kak na vashem foto (komnata / okno)</text>
  <text x="600" y="62" text-anchor="middle" fill="#666">trubki vidny: iz bokovoj steny, pod podokonnik</text>
  <!-- stena sprava (otkuda trubki) -->
  <rect x="950" y="120" width="120" height="650" fill="#ddd" stroke="#333" stroke-width="3"/>
  <!-- okno -->
  <rect x="120" y="120" width="720" height="420" fill="#e8f4ff" stroke="#06c" stroke-width="4"/>
  <rect x="120" y="500" width="720" height="35" fill="#fff" stroke="#999" stroke-width="2"/>
  <text x="480" y="525" text-anchor="middle">podokonnik</text>
  <!-- diagonal ot pravoj steny -->
  <path d="M 950 200 Q 880 320 820 480" class="pipe"/>
  <path d="M 950 230 Q 870 350 800 500" class="pipe"/>
  <!-- gorizont pod podokonnikom v korobe -->
  <rect x="200" y="535" width="700" height="70" class="box"/>
  <line x1="220" y1="570" x2="880" y2="570" class="pipe"/>
  <line x1="220" y1="555" x2="880" y2="555" class="pipe"/>
  <text x="480" y="565" text-anchor="middle" font-size="18" fill="#060" font-weight="bold">korob 0,07 (vys) vynos 0,06</text>
  <!-- otmetka 0,6 ot pola -->
  <line x1="80" y1="780" x2="920" y2="780" stroke="#000" stroke-width="4"/>
  <text x="100" y="770">POL</text>
  <line x1="80" y1="780" x2="80" y2="605" stroke="#e00" stroke-width="3"/>
  <text x="55" y="700" transform="rotate(-90 55 700)" fill="#c00" font-weight="bold">0,60</text>
  <text x="480" y="850" text-anchor="middle" fill="#666">Sechenie 0,07 x 0,06 - section-ac-trunk.svg</text>
</svg>
