<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="Arial,sans-serif">
  <style>
    text { font-size: 24px; fill: #111; }
    .wall { fill: #ccc; stroke: #333; stroke-width: 3; }
    .box { fill: #8f8; stroke: #060; stroke-width: 4; }
  </style>
  <text x="450" y="40" text-anchor="middle" font-size="28" font-weight="bold">Sechenie koroba (vid s torna logii)</text>
  <!-- stena, logiya sprava -->
  <rect x="80" y="120" width="80" height="400" class="wall"/>
  <text x="120" y="350" transform="rotate(-90 120 350)">sten0</text>
  <rect x="160" y="280" width="60" height="70" class="box"/>
  <text x="190" y="265" text-anchor="middle" font-size="20">0,07</text>
  <line x1="160" y1="350" x2="220" y2="350" stroke="#060" stroke-width="2"/>
  <text x="240" y="355" font-size="20">0,06 v logiyu</text>
  <text x="450" y="620" text-anchor="middle">Chistovoj material zakryvaet korob</text>
  <text x="450" y="660" text-anchor="middle" fill="#666">Otvod trubok v ulitsu: 0,8 ot torncevoj steny, h=0,6</text>
</svg>
