<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-250 0 6600 2900" font-family="Arial,sans-serif">
  <style>
    text { font-size: 48px; fill: #111; }
    .dim { font-size: 42px; fill: #333; }
    .lbl { font-size: 40px; fill: #c00; font-weight: bold; }
  </style>
  <!-- POL vnizu Y=2600; vysota steny 2470; podokonnik/parapet 890 ot POLA -->
  <text x="3000" y="80" text-anchor="middle" font-size="58" font-weight="bold">PERED — balkonnyj blok 6,00 m</text>
  <text x="3000" y="140" text-anchor="middle" class="dim">vid s polom vnizu (kak na fasade)</text>
  <rect x="0" y="130" width="6000" height="2470" fill="#eee" stroke="#111" stroke-width="14"/>
  <line x1="0" y1="2600" x2="6000" y2="2600" stroke="#000" stroke-width="14"/>
  <text x="200" y="2570" font-weight="bold">POL</text>
  <!-- parapet 0,89 m ot pola (niz) -->
  <rect x="0" y="1710" width="6000" height="890" fill="#ccc" stroke="#666" stroke-width="10"/>
  <text x="3000" y="2200" text-anchor="middle">parapet / podokonnik 0,89 ot POLA</text>
  <!-- osteklenie nad podokonnikom -->
  <rect x="40" y="130" width="5920" height="1580" fill="#bfe8ff" stroke="#06c" stroke-width="12"/>
  <text x="3000" y="900" text-anchor="middle" fill="#036" font-size="52">osteklenie</text>
  <line x1="0" y1="1710" x2="6000" y2="1710" stroke="#e00" stroke-width="10"/>
  <text x="3000" y="1650" text-anchor="middle" class="lbl">verh podokonnika (0,89 ot pola)</text>
  <line x1="0" y1="130" x2="6000" y2="130" stroke="#111" stroke-width="8"/>
  <text x="3000" y="200" text-anchor="middle" class="dim">potolok / verh steny 2,47</text>
  <!-- razmery -->
  <line x1="-80" y1="1710" x2="-80" y2="2600" stroke="#e00" stroke-width="5"/>
  <text x="-130" y="2180" transform="rotate(-90 -130 2180)" class="lbl">890</text>
  <line x1="-80" y1="130" x2="-80" y2="1710" stroke="#06c" stroke-width="5"/>
  <text x="-130" y="950" transform="rotate(-90 -130 950)" class="dim">1580</text>
  <line x1="0" y1="2780" x2="6000" y2="2780" stroke="#111" stroke-width="6"/>
  <text x="3000" y="2860" text-anchor="middle" font-weight="bold">6000</text>
</svg>
