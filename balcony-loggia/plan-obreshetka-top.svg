<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-280 -200 6800 1400" font-family="Arial,sans-serif">
  <style>
    text { font-size: 40px; fill: #111; }
    .h { font-size: 48px; font-weight: bold; }
    .batten { stroke: #c00; stroke-width: 8; }
    .wall { fill: #eee; stroke: #111; stroke-width: 10; }
    .note { font-size: 34px; fill: #036; }
    .ac { fill: rgba(0,120,0,0.25); stroke: #060; stroke-width: 5; }
  </style>
  <text x="3100" y="-80" text-anchor="middle" class="h">Plan: obreshetka (stoiki 500 mm)</text>
  <rect x="0" y="0" width="6000" height="1000" class="wall"/>
  <path d="M 5200 1000 L 5200 200 L 6000 200 L 6000 1000 Z" fill="#ddd" stroke="#444" stroke-width="6"/>
  <text x="5600" y="620" text-anchor="middle" font-size="32">nisha 0,8</text>
  <text x="3000" y="-20" text-anchor="middle" fill="#06c" font-weight="bold">Fasad 6 m  paraet (obreshetka vynos 60 mm)</text>
  <text x="3000" y="1080" text-anchor="middle" fill="#c60" font-weight="bold">Stena kvartiry 6,8 m</text>
  <!-- battens front 6m at 0,500,...,6000 -->
  <g class="batten">
    <line x1="0" y1="50" x2="0" y2="950"/>
    <line x1="500" y1="50" x2="500" y2="950"/>
    <line x1="1000" y1="50" x2="1000" y2="950"/>
    <line x1="1500" y1="50" x2="1500" y2="950"/>
    <line x1="2000" y1="50" x2="2000" y2="950"/>
    <line x1="2500" y1="50" x2="2500" y2="950"/>
    <line x1="3000" y1="50" x2="3000" y2="950"/>
    <line x1="3500" y1="50" x2="3500" y2="950"/>
    <line x1="4000" y1="50" x2="4000" y2="950"/>
    <line x1="4500" y1="50" x2="4500" y2="950"/>
    <line x1="5000" y1="50" x2="5000" y2="950"/>
    <line x1="5500" y1="50" x2="5500" y2="950"/>
    <line x1="6000" y1="50" x2="6000" y2="950"/>
  </g>
  <text x="3000" y="500" text-anchor="middle" fill="#c00" font-weight="bold">13 stoek (tolko zona paraeta 0,89 m po vysote)</text>
  <rect x="150" y="820" width="5700" height="120" class="ac"/>
  <text x="3000" y="900" text-anchor="middle" font-size="36" fill="#060">korob AC  za ploskostyu panelej</text>
  <!-- apartment wall below -->
  <rect x="0" y="1020" width="6800" height="80" fill="#f5e6dc" stroke="#c60" stroke-width="4"/>
  <g class="batten">
    <line x1="0" y1="1020" x2="0" y2="1100"/>
    <line x1="500" y1="1020" x2="500" y2="1100"/>
    <line x1="1000" y1="1020" x2="1000" y2="1100"/>
    <line x1="1500" y1="1020" x2="1500" y2="1100"/>
    <line x1="2000" y1="1020" x2="2000" y2="1100"/>
    <line x1="2500" y1="1020" x2="2500" y2="1100"/>
    <line x1="3000" y1="1020" x2="3000" y2="1100"/>
    <line x1="3500" y1="1020" x2="3500" y2="1100"/>
    <line x1="4000" y1="1020" x2="4000" y2="1100"/>
    <line x1="4500" y1="1020" x2="4500" y2="1100"/>
    <line x1="5000" y1="1020" x2="5000" y2="1100"/>
    <line x1="5500" y1="1020" x2="5500" y2="1100"/>
    <line x1="6000" y1="1020" x2="6000" y2="1100"/>
    <line x1="6500" y1="1020" x2="6500" y2="1100"/>
    <line x1="6800" y1="1020" x2="6800" y2="1100"/>
  </g>
  <text x="3400" y="1180" text-anchor="middle" class="note">15 linij  v proemy stoiki ne idut (sm. OBRESHEOTKA.md)</text>
  <!-- side walls notation -->
  <text x="-120" y="520" transform="rotate(-90 -120 520)" font-weight="bold">bok 1 m: 3 stoiki</text>
  <text x="6120" y="520" transform="rotate(-90 6120 520)" font-weight="bold">bok 1 m: 3 stoiki</text>
  <text x="3000" y="1320" text-anchor="middle" font-size="36">Potolok 6x1: 13 poperechnyh bruskov po 1 m (shag 500 po dline 6 m)</text>
</svg>
