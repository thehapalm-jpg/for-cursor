<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" font-family="Arial,sans-serif">
  <style>
    text { font-size: 20px; fill: #111; }
    .h { font-size: 24px; font-weight: bold; }
    .note { font-size: 17px; fill: #444; }
  </style>
  <text x="500" y="36" text-anchor="middle" class="h">Razrez paraeta (ploskost steny, sm. vdol balkona)</text>
  <text x="500" y="62" text-anchor="middle" class="note">Vynos ploskosti panelej 60 mm ot shtukaturki</text>

  <!-- wall -->
  <rect x="60" y="110" width="70" height="680" fill="#bbb" stroke="#333" stroke-width="2"/>
  <text x="95" y="460" transform="rotate(-90 95 460)" text-anchor="middle">stena</text>

  <!-- 60 mm cavity -->
  <rect x="130" y="110" width="60" height="680" fill="#f8f8f8" stroke="#999" stroke-width="1" stroke-dasharray="6 4"/>
  <rect x="135" y="455" width="50" height="55" fill="rgba(0,120,0,0.35)" stroke="#060" stroke-width="2"/>
  <text x="160" y="448" text-anchor="middle" font-size="16" fill="#060">trubki</text>
  <text x="160" y="525" text-anchor="middle" font-size="15">korob ~0,07</text>

  <!-- horizontal guides (seen in section as 40 mm depth) -->
  <rect x="130" y="730" width="40" height="40" fill="#8b4513" stroke="#532" stroke-width="2"/>
  <text x="250" y="758" class="note">nizhnyaya napravlyayushchaya 20x40</text>
  <rect x="130" y="150" width="40" height="40" fill="#8b4513" stroke="#532" stroke-width="2"/>
  <text x="250" y="178" class="note">verh napravlyayushchej (0,89 ot pola)</text>

  <!-- ONE batten: section cut through one stud (runs along 6 m window, into the drawing) -->
  <rect x="130" y="190" width="40" height="540" fill="#a0522d" stroke="#532" stroke-width="2"/>
  <text x="250" y="470" class="note">1 stoyka 20x40 (rez popadaet v odnu stoyku)</text>
  <text x="250" y="498" class="note">Ostalnye stoiki — kazhdye 500 mm vdol okna, v etom razreze ne vidny</text>

  <!-- panels on face -->
  <rect x="170" y="110" width="6" height="680" fill="#e0e0e0" stroke="#666" stroke-width="1"/>
  <line x1="176" y1="200" x2="320" y2="200" stroke="#06c" stroke-width="1"/>
  <line x1="176" y1="430" x2="320" y2="430" stroke="#06c" stroke-width="1"/>
  <line x1="176" y1="660" x2="320" y2="660" stroke="#06c" stroke-width="1"/>
  <text x="330" y="200" font-size="16">ryad paneli</text>
  <text x="330" y="430" font-size="16">ryad paneli</text>
  <text x="330" y="660" font-size="16">ryad paneli</text>

  <!-- dimensions -->
  <line x1="130" y1="810" x2="190" y2="810" stroke="#111" stroke-width="2"/>
  <text x="160" y="835" text-anchor="middle" font-weight="bold">60</text>
  <line x1="520" y1="790" x2="520" y2="150" stroke="#06c" stroke-width="2"/>
  <text x="545" y="480" fill="#06c" font-weight="bold">890</text>
  <line x1="600" y1="790" x2="600" y2="735" stroke="#060" stroke-width="2"/>
  <text x="625" y="768" fill="#060" font-size="16">600</text>

  <line x1="40" y1="790" x2="560" y2="790" stroke="#000" stroke-width="3"/>
  <text x="50" y="820" font-weight="bold">POL</text>

  <!-- depth axis hint -->
  <text x="500" y="865" text-anchor="middle" class="note">Vlevo — stena | zazor pod trubki | obreshetka | panel 6 mm</text>
</svg>
