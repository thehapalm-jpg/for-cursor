<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-200 -320 7800 3200" font-family="Arial,sans-serif">
  <style>
    text { font-size: 48px; fill: #111; }
    .dim { font-size: 42px; fill: #333; }
    .lbl { font-size: 36px; fill: #036; }
    .sub { font-size: 34px; fill: #666; }
  </style>
  <!-- y=0 potolok, y=2470 pol; podokonnik 0,75 ot pola -> y=1720 -->
  <text x="3400" y="-200" text-anchor="middle" font-size="58" font-weight="bold">Stena kvartiry 6,80 m</text>
  <text x="3400" y="-130" text-anchor="middle" class="sub">Odna peremychka; podokonnik 0,75 ot pola (pod oknom)</text>
  <rect x="0" y="0" width="7590" height="2470" fill="#eee" stroke="#111" stroke-width="14"/>
  <!-- zona 0,25 do potolka nad proemami -->
  <rect x="800" y="0" width="6790" height="310" fill="#ddd" stroke="none"/>
  <line x1="800" y1="310" x2="7590" y2="310" stroke="#111" stroke-width="10"/>
  <text x="7400" y="280" class="lbl">peremychka</text>
  <rect x="0" y="0" width="800" height="2470" fill="#ccc" stroke="#666" stroke-width="8"/>
  <text x="400" y="1300" text-anchor="middle" class="sub">0,80 nisha</text>
  <rect x="800" y="310" width="1710" height="2160" fill="#e5e5e5" stroke="none"/>
  <!-- okno 0,99: steklo 310..1720, nizhe podokonnik -->
  <rect x="2510" y="310" width="990" height="1410" fill="#dff" stroke="#06c" stroke-width="12"/>
  <rect x="2510" y="1720" width="990" height="750" fill="#e8e8e8" stroke="#06c" stroke-width="8"/>
  <text x="3005" y="1100" text-anchor="middle">okno 0,99</text>
  <text x="3005" y="1160" text-anchor="middle" class="sub">verh = blok</text>
  <rect x="3500" y="310" width="400" height="2160" fill="#e5e5e5" stroke="none"/>
  <!-- balkonnyj blok -->
  <rect x="3900" y="310" width="2220" height="2160" fill="#f0f0f0" stroke="#c60" stroke-width="14"/>
  <!-- dver na pol -->
  <rect x="3900" y="310" width="900" height="2160" fill="#fed" stroke="#c60" stroke-width="8"/>
  <text x="4350" y="1400" text-anchor="middle" font-weight="bold">dver 0,90</text>
  <!-- okno v bloke -->
  <rect x="4800" y="310" width="1320" height="1410" fill="#cfe8ff" stroke="#c60" stroke-width="8"/>
  <rect x="4800" y="1720" width="1320" height="750" fill="#ddd" stroke="#c60" stroke-width="6"/>
  <text x="5460" y="1100" text-anchor="middle" font-weight="bold">okno (chast bloka)</text>
  <text x="5010" y="500" text-anchor="middle" class="lbl">BALKONNYJ BLOK 2,22</text>
  <!-- podokonnik - liniya POD oknami -->
  <line x1="2510" y1="1720" x2="6120" y2="1720" stroke="#333" stroke-width="6" stroke-dasharray="12 8"/>
  <text x="4300" y="1690" text-anchor="middle" class="dim">podokonnik 0,75 ot pola</text>
  <line x1="0" y1="2470" x2="7590" y2="2470" stroke="#111" stroke-width="8"/>
  <text x="200" y="2430" class="dim">pol</text>
  <rect x="6120" y="310" width="1470" height="2160" fill="#e5e5e5" stroke="none"/>
  <text x="6855" y="1300" text-anchor="middle" class="sub">1,47</text>
  <text x="200" y="1300" transform="rotate(-90 200 1300)" font-weight="bold">H proema 2,16</text>
  <text x="200" y="150" transform="rotate(-90 200 150)" class="dim">0,25</text>
  <text x="400" y="2700" text-anchor="middle" class="dim">0,80</text>
  <text x="1655" y="2700" text-anchor="middle" class="dim">1,71</text>
  <text x="3005" y="2700" text-anchor="middle" class="dim">0,99</text>
  <text x="3700" y="2700" text-anchor="middle" class="dim">0,40</text>
  <text x="5010" y="2700" text-anchor="middle" class="dim">2,22</text>
  <text x="6855" y="2700" text-anchor="middle" class="dim">1,47</text>
  <line x1="0" y1="2900" x2="7590" y2="2900" stroke="#111" stroke-width="6"/>
  <text x="3795" y="2980" text-anchor="middle" font-weight="bold">6,79 m po eskizu</text>
</svg>
