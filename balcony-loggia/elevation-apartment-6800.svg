<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-250 0 7900 2900" font-family="Arial,sans-serif">
  <style>
    text { font-size: 48px; fill: #111; }
    .dim { font-size: 40px; fill: #333; }
    .lbl { font-size: 36px; fill: #036; font-weight: bold; }
    .sub { font-size: 34px; fill: #666; }
  </style>
  <!--
    Koordinaty: POL vnizu (Y=2600), potolok Y=130.
    Ot pola: podokonnik 750 mm -> Y = 2600-750 = 1850
    Verh proema H=2160 ot pola -> Y = 2600-2160 = 440
    Nad proemom do potolka ~310 mm (0,25)
  -->
  <text x="3700" y="80" text-anchor="middle" font-size="56" font-weight="bold">Stena kvartiry 6,80 m (vid s polom vnizu)</text>
  <rect x="0" y="130" width="7590" height="2470" fill="#eee" stroke="#111" stroke-width="14"/>
  <line x1="0" y1="2600" x2="7590" y2="2600" stroke="#000" stroke-width="14"/>
  <text x="400" y="2570" class="lbl">POL</text>
  <!-- peremychka / verh proemov -->
  <line x1="800" y1="440" x2="7590" y2="440" stroke="#000" stroke-width="10"/>
  <text x="7400" y="410" class="lbl">peremychka (odin verh)</text>
  <rect x="800" y="130" width="6790" height="310" fill="#ddd" stroke="none"/>
  <text x="4200" y="280" text-anchor="middle" class="sub">0,25 do potolka</text>
  <!-- nisha -->
  <rect x="0" y="130" width="800" height="2470" fill="#ccc" stroke="#666" stroke-width="8"/>
  <text x="400" y="1500" text-anchor="middle" class="sub">0,80 nisha</text>
  <rect x="800" y="440" width="1710" height="2160" fill="#e5e5e5"/>
  <!-- okno 0,99 -->
  <rect x="2510" y="440" width="990" height="1410" fill="#bfe8ff" stroke="#06c" stroke-width="12"/>
  <rect x="2510" y="1850" width="990" height="750" fill="#ccc" stroke="#06c" stroke-width="8"/>
  <text x="3005" y="1200" text-anchor="middle">okno 0,99</text>
  <rect x="3500" y="440" width="400" height="2160" fill="#e5e5e5"/>
  <!-- balkonnyj blok -->
  <rect x="3900" y="440" width="2220" height="2160" fill="#f5f5f5" stroke="#c60" stroke-width="14"/>
  <rect x="3900" y="440" width="900" height="2160" fill="#ffe8cc" stroke="#c60" stroke-width="8"/>
  <text x="4350" y="1500" text-anchor="middle" font-weight="bold">dver 0,90</text>
  <rect x="4800" y="440" width="1320" height="1410" fill="#bfe8ff" stroke="#c60" stroke-width="8"/>
  <rect x="4800" y="1850" width="1320" height="750" fill="#bbb" stroke="#c60" stroke-width="6"/>
  <text x="5460" y="1200" text-anchor="middle" font-weight="bold">okno bloka</text>
  <text x="5010" y="600" text-anchor="middle" class="lbl">BALKONNYJ BLOK 2,22</text>
  <!-- PODOKONNIK - chertim u POLA -->
  <line x1="2400" y1="1850" x2="6200" y2="1850" stroke="#e00" stroke-width="10"/>
  <line x1="2400" y1="2600" x2="2400" y2="1850" stroke="#e00" stroke-width="4"/>
  <line x1="6200" y1="2600" x2="6200" y2="1850" stroke="#e00" stroke-width="4"/>
  <text x="4300" y="1920" text-anchor="middle" fill="#c00" font-size="44" font-weight="bold">podokonnik 0,75 ot POLA</text>
  <text x="4300" y="2250" text-anchor="middle" class="dim">seryj nizhe linii = podokonnaya chast (do pola)</text>
  <rect x="6120" y="440" width="1470" height="2160" fill="#e5e5e5"/>
  <!-- gorizont razmery -->
  <text x="400" y="2780" text-anchor="middle" class="dim">0,80</text>
  <text x="1655" y="2780" text-anchor="middle" class="dim">1,71</text>
  <text x="3005" y="2780" text-anchor="middle" class="dim">0,99</text>
  <text x="3700" y="2780" text-anchor="middle" class="dim">0,40</text>
  <text x="5010" y="2780" text-anchor="middle" class="dim">2,22</text>
  <text x="6855" y="2780" text-anchor="middle" class="dim">1,47</text>
</svg>
