# GitHub Pages — song-therapy/
# Secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL
#   SUPABASE_ANON_KEY

name: Deploy song-therapy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Supabase config
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY not set — site will show auth config error"
          fi
          cat > song-therapy/js/config.js << 'EOF'
          export const SUPABASE_URL = "${{ secrets.SUPABASE_URL }}";
          export const SUPABASE_ANON_KEY = "${{ secrets.SUPABASE_ANON_KEY }}";
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: song-therapy

      - id: deployment
        uses: actions/deploy-pages@v4
